<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina non trovata — Elena Koulakova | Guida Turistica</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="theme-color" content="#8B6914">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"></noscript>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #FDFBF7;
            color: #2C2C2C;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-page { max-width: 520px; }
        .error-code {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 700;
            color: #C4A24E;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 600;
            color: #2C2C2C;
            margin-bottom: 1rem;
        }
        .error-text {
            font-size: 0.95rem;
            color: #6B6B6B;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        .error-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #8B6914;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-decoration: none;
            border-radius: 50px;
            transition: background 0.3s ease;
        }
        .error-btn:hover { background: #6B4F0E; }
        .error-divider {
            width: 60px;
            height: 2px;
            background: #C4A24E;
            margin: 0 auto 1.5rem;
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-code">404</div>
        <div class="error-divider"></div>
        <h1 class="error-title">Pagina non trovata</h1>
        <p class="error-text">
            La pagina che cerchi non esiste o potrebbe essere stata spostata.<br>
            Torna alla home per scoprire i tour tra Umbria e Toscana.
        </p>
        <a href="/" class="error-btn">Torna alla Home</a>
    </main>
</body>
</html>
